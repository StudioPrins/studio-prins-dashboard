name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controle:
    name: Lint, types, tests en build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Draait bewust zonder secrets: de databaseverbinding en de Anthropic-client
      # worden lui opgebouwd, dus een build hoort te slagen zonder sleutels. Zou
      # dat veranderen, dan valt het hier meteen op.
      - name: Build
        run: npm run build
